name: Links

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # oduna.dev is the site itself and may not resolve before DNS is set up
          args: --no-progress --exclude '^https://oduna\.dev' index.html README.md
          fail: false
      - name: Open an issue on broken links
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: Broken links on oduna.dev
          content-filepath: ./lychee/out.md
